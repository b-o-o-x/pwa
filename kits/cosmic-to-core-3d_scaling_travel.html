<!DOCTYPE html>

      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02040a;
      font-family: 'Noto Sans KR', sans-serif;
      color: #ffffff;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    .glass-panel {
      background: rgba(10, 16, 30, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .nav-btn {
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
    }
    .nav-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.98);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .stage-dot {
      transition: all 0.25s ease;
    }
    .stage-dot.active {
      transform: scale(1.35);
      background-color: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }
    .stage-dot.origin-dot {
      border: 2px solid #fbbf24;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .horizon-indicator {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

// Web Audio API Synthesized Sound
let audioCtx = null;
let soundEnabled = false;
let ambientOsc = null;
let ambientGain = null;

function showToast(msg) {
  const el = document.getElementById('toast-msg');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => {
    el.style.opacity = '0';
  }, 2200);
}

// ============================================================================
// AUDIO ENGINE (Procedural Web Audio API - Zero External Files)
// ============================================================================
function initAudio() {
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();

  ambientOsc = audioCtx.createOscillator();
  ambientGain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();

  ambientOsc.type = 'sine';
  ambientOsc.frequency.value = 110;
  filter.type = 'lowpass';
  filter.frequency.value = 320;

  ambientGain.gain.value = 0.0;
  ambientOsc.connect(filter);
  filter.connect(ambientGain);
  ambientGain.connect(audioCtx.destination);
  ambientOsc.start();
}

function toggleSound() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundEnabled = !soundEnabled;
  const icon = document.getElementById('sound-icon');
  const label = document.getElementById('sound-label');
  if (soundEnabled) {
    icon.textContent = '🔊';
    label.textContent = '사운드 ON';
    updateAmbientPitch(STAGES[currentStageIdx].level);
    ambientGain.gain.setTargetAtTime(0.06, audioCtx.currentTime, 0.3);
    showToast('앰비언트 사운드가 켜졌습니다');
  } else {
    icon.textContent = '🔇';
    label.textContent = '사운드 OFF';
    ambientGain.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.2);
    showToast('사운드가 음소거되었습니다');
  }
}

function updateAmbientPitch(level) {
  if (!audioCtx || !ambientOsc) return;
  // Higher pitch in space, warm middle at horizon, deep sub-bass in core
  const freq = level >= 0
    ? 110 + level * 28
    : Math.max(42, 110 + level * 8);
  ambientOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.5);
}

function playTransitionWhoosh(direction) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  if (direction > 0) {
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.45);
  } else {
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(75, now + 0.45);
  }
  gain.gain.setValueAtTime(0.08, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.52);
}

// ============================================================================
// PROCEDURAL TEXTURE HELPERS
// ============================================================================
function createCircleGlowTexture(innerColor, outerColor, size = 128) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, innerColor);
  grad.addColorStop(0.4, outerColor);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}

function createEarthTexture() {
  const w = 1024, h = 512;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Deep Ocean
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, h);
  oceanGrad.addColorStop(0, '#1e3a8a');
  oceanGrad.addColorStop(0.3, '#0369a1');
  oceanGrad.addColorStop(0.5, '#0284c7');
  oceanGrad.addColorStop(0.7, '#0369a1');
  oceanGrad.addColorStop(1, '#1e3a8a');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, w, h);

  function drawLandmass(points, color) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // North America
  drawLandmass([
    [115, 92], [168, 76], [238, 84], [298, 108], [308, 148],
    [274, 188], [248, 224], [236, 258], [218, 248], [198, 212],
    [174, 174], [142, 136]
  ], '#16a34a');

  // Greenland
  drawLandmass([
    [328, 46], [378, 42], [394, 74], [362, 104], [332, 90]
  ], '#e2e8f0');

  // South America
  drawLandmass([
    [260, 266], [308, 276], [348, 316], [338, 370],
    [308, 428], [282, 462], [268, 414], [256, 342]
  ], '#15803d');

  // Europe
  drawLandmass([
    [468, 92], [520, 74], [568, 88], [574, 134],
    [544, 158], [504, 166], [472, 152], [462, 122]
  ], '#22c55e');

  // Africa
  drawLandmass([
    [468, 178], [528, 176], [578, 206], [595, 256],
    [572, 326], [542, 386], [512, 382], [492, 316], [458, 256]
  ], '#16a34a');

  // Eurasia / Asia
  drawLandmass([
    [572, 82], [668, 68], [778, 74], [878, 92], [916, 126],
    [866, 158], [834, 188], [806, 226], [776, 258], [736, 246],
    [706, 272], [672, 232], [636, 218], [588, 192], [572, 138]
  ], '#15803d');

  // Korean Peninsula & Japan
  drawLandmass([[826, 166], [838, 166], [840, 192], [828, 194]], '#4ade80');
  drawLandmass([[856, 164], [867, 172], [858, 202], [848, 198]], '#4ade80');

  // Australia & New Zealand
  drawLandmass([
    [786, 318], [848, 308], [886, 338], [876, 382], [822, 392], [782, 368]
  ], '#16a34a');
  drawLandmass([[908, 396], [922, 406], [912, 428], [900, 422]], '#4ade80');

  // Desert / Arid belts (Sahara, Arabia, Central Asia, Outback)
  ctx.fillStyle = 'rgba(202, 138, 4, 0.72)';
  [
    [515, 206, 46, 20],
    [594, 204, 24, 15],
    [695, 148, 52, 20],
    [832, 348, 30, 16]
  ].forEach(([dx, dy, rx, ry]) => {
    ctx.beginPath();
    ctx.ellipse(dx, dy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Polar ice caps
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, w, 24);
  ctx.fillRect(0, h - 24, w, 24);

  return new THREE.CanvasTexture(canvas);
}

// ============================================================================
// SCENE INITIALIZATION & 16-LAYER WORLD BUILDERS
// ============================================================================
function initThree() {
  const container = document.getElementById('canvas-container');
  clock = new THREE.Clock();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(STAGES[currentStageIdx].bgColor);
  scene.fog = new THREE.FogExp2(STAGES[currentStageIdx].fogColor, STAGES[currentStageIdx].fogDensity);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(...STAGES[currentStageIdx].camPos);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Global Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.1);
  dirLight.position.set(15, 25, 18);
  scene.add(dirLight);

  // Create groups for each level
  STAGES.forEach(s => {
    const g = new THREE.Group();
    g.visible = (s.level === 0);
    scene.add(g);
    stageGroups[s.level] = g;
  });

  // Build every single level's 3D environment
  buildLevel0_Horizon(stageGroups[0]);
  buildLevel1_City(stageGroups[1]);
  buildLevel2_KoreaMap(stageGroups[2]);
  buildLevel3_Clouds(stageGroups[3]);
  buildLevel4_Earth(stageGroups[4]);
  buildLevel5_SolarSystem(stageGroups[5]);
  buildLevel6_MilkyWay(stageGroups[6]);
  buildLevel7_Universe(stageGroups[7]);

  buildLevelM1_GrassInsects(stageGroups[-1]);
  buildLevelM2_RootsSoil(stageGroups[-2]);
  buildLevelM3_SubwaySewage(stageGroups[-3]);
  buildLevelM4_StrataFossils(stageGroups[-4]);
  buildLevelM5_BedrockDrill(stageGroups[-5]);
  buildLevelM6_CrustMagma(stageGroups[-6]);
  buildLevelM7_Mantle(stageGroups[-7]);
  buildLevelM8_Core(stageGroups[-8]);

  setupSidebar();
  updateUI();
  setupInputs();

  window.addEventListener('resize', onWindowResize);
  document.addEventListener('fullscreenchange', updateFullscreenButton);
}

// LEVEL 0: THE HORIZON (지평선 위의 나 - 절반 하늘, 절반 땅 + 강아지, 고양이, 나비, 잠자리, 새, 벌)

function buildLevel0_Horizon(group) {
  // Sky dome gradient
  const skyGeo = new THREE.SphereGeometry(120, 32, 16);
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, side: THREE.BackSide });
  const skyDome = new THREE.Mesh(skyGeo, skyMat);
  group.add(skyDome);

  // Warm Sun on Horizon
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createCircleGlowTexture('rgba(255,253,220,1)', 'rgba(253,224,71,0.35)'),
    transparent: true
  }));
  sunSprite.position.set(-18, 12, -55);
  sunSprite.scale.set(28, 28, 1);
  group.add(sunSprite);

  // Upper half soft clouds
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
  const clouds = [];
  for (let i = 0; i < 14; i++) {
    const cGroup = new THREE.Group();
    const puffs = 3 + Math.floor(Math.random() * 3);
    for (let p = 0; p < puffs; p++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(1.4 + Math.random(), 12, 12), cloudMat);
      puff.position.set((p - 1.5) * 1.5, Math.random() * 0.5, Math.random() * 0.8);
      puff.scale.set(1.3, 0.75, 0.9);
      cGroup.add(puff);
    }
    cGroup.position.set((Math.random() - 0.5) * 75, 5 + Math.random() * 12, -20 - Math.random() * 35);
    group.add(cGroup);
    clouds.push({ mesh: cGroup, speed: 0.3 + Math.random() * 0.4 });
  }

  // Lower Half: Vast Green Meadow / Horizon Ground Plane
  const groundGeo = new THREE.PlaneGeometry(240, 240, 32, 32);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  group.add(ground);

  // Subtle rolling hills on the horizon
  const hillMat = new THREE.MeshLambertMaterial({ color: 0x1b5e20 });
  for (let i = 0; i < 9; i++) {
    const hill = new THREE.Mesh(new THREE.SphereGeometry(12 + Math.random() * 8, 20, 12), hillMat);
    hill.scale.set(2.5, 0.35, 1.2);
    hill.position.set((i - 4) * 22, -1.5, -55 - Math.random() * 15);
    group.add(hill);
  }

  // Cross-section earth edge in foreground (subtle reminder of underground below)
  const soilCutGeo = new THREE.BoxGeometry(40, 6, 20);
  const soilCutMat = new THREE.MeshLambertMaterial({ color: 0x4e342e });
  const soilCut = new THREE.Mesh(soilCutGeo, soilCutMat);
  soilCut.position.set(0, -3.02, 0);
  group.add(soilCut);

  // The Human Figure ("나" standing right on the Horizon Line)
  const human = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xfdba74 });
  const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
  const scarfMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0x881337, emissiveIntensity: 0.3 });

  // Legs
  const legGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.85, 10);
  const leftLeg = new THREE.Mesh(legGeo, pantsMat);
  leftLeg.position.set(-0.14, 0.425, 0);
  const rightLeg = new THREE.Mesh(legGeo, pantsMat);
  rightLeg.position.set(0.14, 0.425, 0);

  // Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 0.78, 12), shirtMat);
  torso.position.set(0, 1.22, 0);

  // Scarf fluttering slightly
  const scarf = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.12), scarfMat);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 16, 16), skinMat);
  head.position.set(0, 1.85, 0);

  // Arms
  const armGeo = new THREE.CylinderGeometry(0.07, 0.06, 0.68, 8);
  const leftArm = new THREE.Mesh(armGeo, shirtMat);
  leftArm.position.set(-0.3, 1.2, 0);
  leftArm.rotation.z = 0.15;
  const rightArm = new THREE.Mesh(armGeo, shirtMat);
  rightArm.position.set(0.3, 1.2, 0);
  rightArm.rotation.z = -0.15;

  // Glowing Aura Ring under feet
  const ringGeo = new THREE.RingGeometry(0.45, 0.55, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;

  human.add(leftLeg, rightLeg, torso, scarf, head, leftArm, rightArm, ring);
  human.position.set(0, 0, 0);
  group.add(human);

  // Dog (강아지) beside human on grass
  const dog = new THREE.Group();
  const dogMat = new THREE.MeshLambertMaterial({ color: 0xd97706 });
  const dogEarMat = new THREE.MeshLambertMaterial({ color: 0x78350f });
  const dogBody = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.22, 0.2), dogMat);
  dogBody.position.y = 0.22;
  const dogHead = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), dogMat);
  dogHead.position.set(0.24, 0.34, 0);
  const dogEars = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.23), dogEarMat);
  dogEars.position.set(0.22, 0.42, 0);
  const dogTail = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.2, 8), dogMat);
  dogTail.position.set(-0.25, 0.32, 0);
  dogTail.rotation.z = 0.55;
  dog.add(dogBody, dogHead, dogEars, dogTail);
  [[-0.14, -0.06], [-0.14, 0.06], [0.14, -0.06], [0.14, 0.06]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.15, 8), dogMat);
    leg.position.set(lx, 0.075, lz);
    dog.add(leg);
  });
  dog.position.set(-1.15, 0, 0.55);
  dog.rotation.y = 0.35;
  group.add(dog);

  // Cat (고양이) on the right side of human
  const cat = new THREE.Group();
  const catMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
  const catBody = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.16), catMat);
  catBody.position.y = 0.18;
  const catHead = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), catMat);
  catHead.position.set(-0.2, 0.29, 0);
  const catEarL = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.08, 4), catMat);
  catEarL.position.set(-0.2, 0.39, -0.045);
  const catEarR = catEarL.clone();
  catEarR.position.z = 0.045;
  const catTail = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.24, 8), catMat);
  catTail.position.set(0.21, 0.29, 0);
  catTail.rotation.z = -0.45;
  cat.add(catBody, catHead, catEarL, catEarR, catTail);
  [[-0.11, -0.05], [-0.11, 0.05], [0.11, -0.05], [0.11, 0.05]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.13, 8), catMat);
    leg.position.set(lx, 0.065, lz);
    cat.add(leg);
  });
  cat.position.set(1.25, 0, 0.65);
  cat.rotation.y = -0.4;
  group.add(cat);

  // Butterflies flying in the sky (몸통 관절 기준으로 위아래로 파닥파닥 날갯짓하는 나비)
  const skyButterflies = [];
  const bfWingColors = [0x38bdf8, 0xfbbf24, 0xf472b6];
  for (let i = 0; i < 3; i++) {
    const bf = new THREE.Group();
    const bfBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.02, 0.32, 8),
      new THREE.MeshBasicMaterial({ color: 0x1e1b4b })
    );
    bfBody.rotation.x = Math.PI / 2;

    const bfWingMat = new THREE.MeshBasicMaterial({ color: bfWingColors[i], side: THREE.DoubleSide });

    // 왼쪽 날개 관절(Pivot)
    const lPivot = new THREE.Group();
    const lUpper = new THREE.Mesh(new THREE.CircleGeometry(0.18, 12), bfWingMat);
    lUpper.rotation.x = -Math.PI / 2;
    lUpper.position.set(-0.16, 0, 0.06);
    const lLower = new THREE.Mesh(new THREE.CircleGeometry(0.13, 12), bfWingMat);
    lLower.rotation.x = -Math.PI / 2;
    lLower.position.set(-0.12, 0, -0.09);
    lPivot.add(lUpper, lLower);

    // 오른쪽 날개 관절(Pivot)
    const rPivot = new THREE.Group();
    const rUpper = new THREE.Mesh(new THREE.CircleGeometry(0.18, 12), bfWingMat);
    rUpper.rotation.x = -Math.PI / 2;
    rUpper.position.set(0.16, 0, 0.06);
    const rLower = new THREE.Mesh(new THREE.CircleGeometry(0.13, 12), bfWingMat);
    rLower.rotation.x = -Math.PI / 2;
    rLower.position.set(0.12, 0, -0.09);
    rPivot.add(rUpper, rLower);

    bf.add(bfBody, lPivot, rPivot);
    bf.position.set(-2.2 + i * 2.1, 1.75 + (i % 2) * 0.45, 2.0 + i * 0.6);
    group.add(bf);
    skyButterflies.push({ mesh: bf, lPivot, rPivot, base: bf.position.clone(), phase: i * 1.9 });
  }

  // Birds flying across the sky (새 떼)
  const birds = [];
  const birdMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide });
  for (let i = 0; i < 6; i++) {
    const bird = new THREE.Group();
    const wL = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.11), birdMat);
    wL.position.x = -0.17;
    const wR = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.11), birdMat);
    wR.position.x = 0.17;
    bird.add(wL, wR);
    bird.position.set(-7 + i * 2.4, 3.6 + (i % 3) * 0.65, -8 - i * 1.4);
    group.add(bird);
    birds.push({ mesh: bird, wL, wR, phase: i * 1.2 });
  }

  // Dragonflies flying in the air (잠자리)
  const skyDragonflies = [];
  const wingTranslucentMat = new THREE.MeshBasicMaterial({ color: 0xe0f2fe, transparent: true, opacity: 0.78, side: THREE.DoubleSide });
  for (let i = 0; i < 3; i++) {
    const df = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.014, 0.44, 8),
      new THREE.MeshPhongMaterial({ color: 0x06b6d4 })
    );
    body.rotation.z = Math.PI / 2;
    const w1 = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.08), wingTranslucentMat);
    w1.position.set(0.04, 0.03, 0.18);
    const w2 = w1.clone();
    w2.position.z = -0.18;
    df.add(body, w1, w2);
    df.position.set((i - 1) * 2.2, 1.55 + (i % 2) * 0.35, 2.2 + i * 0.5);
    group.add(df);
    skyDragonflies.push({ mesh: df, w1, w2, base: df.position.clone(), phase: i * 1.7 });
  }

  // Bees / Hornets flying near grass & flowers (벌)
  const skyBees = [];
  for (let i = 0; i < 3; i++) {
    const bee = new THREE.Group();
    const abd = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 10, 10),
      new THREE.MeshPhongMaterial({ color: 0xfacc15 })
    );
    abd.scale.set(1.5, 0.9, 0.9);
    const stripe = new THREE.Mesh(
      new THREE.TorusGeometry(0.062, 0.015, 8, 12),
      new THREE.MeshBasicMaterial({ color: 0x09090b })
    );
    stripe.rotation.y = Math.PI / 2;
    const bw1 = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.07), wingTranslucentMat);
    bw1.position.set(0, 0.06, 0.09);
    const bw2 = bw1.clone();
    bw2.position.z = -0.09;
    bee.add(abd, stripe, bw1, bw2);
    bee.position.set((i - 1) * 1.9, 0.95 + (i % 2) * 0.3, 2.8 + i * 0.4);
    group.add(bee);
    skyBees.push({ mesh: bee, bw1, bw2, base: bee.position.clone(), phase: i * 2.1 });
  }

  // Foreground grass tufts & wildflowers
  const tuftMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
  for (let i = 0; i < 90; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.4 + Math.random() * 0.35, 5), tuftMat);
    blade.position.set((Math.random() - 0.5) * 26, 0.15, (Math.random() - 0.3) * 14);
    blade.rotation.z = (Math.random() - 0.5) * 0.3;
    group.add(blade);
  }

  animatables.push((t) => {
    if (!group.visible) return;
    clouds.forEach(c => {
      c.mesh.position.x += c.speed * 0.02;
      if (c.mesh.position.x > 45) c.mesh.position.x = -45;
    });
    scarf.rotation.y = Math.sin(t * 3) * 0.25;
    scarf.rotation.z = Math.cos(t * 2.5) * 0.1;
    ring.scale.setScalar(1 + Math.sin(t * 2.5) * 0.08);
    human.position.y = Math.abs(Math.sin(t * 1.5)) * 0.02;

    dogTail.rotation.x = Math.sin(t * 12) * 0.4;
    catTail.rotation.x = Math.sin(t * 3.5) * 0.25;

    // 나비: 위아래로 펄럭펄럭 날갯짓 + 날갯짓 박자에 맞춘 가벼운 상하 부유
    skyButterflies.forEach(b => {
      const flap = Math.sin(t * 15 + b.phase);
      b.lPivot.rotation.z = -flap * 0.95;
      b.rPivot.rotation.z = flap * 0.95;

      const nx = b.base.x + Math.sin(t * 1.3 + b.phase) * 1.35;
      const ny = b.base.y + Math.cos(t * 2.1 + b.phase) * 0.28 - flap * 0.05;
      b.mesh.rotation.y = Math.cos(t * 1.3 + b.phase) > 0 ? 0.5 : -0.5;
      b.mesh.position.set(nx, ny, b.base.z + Math.sin(t * 0.9 + b.phase) * 0.4);
    });

    birds.forEach(b => {
      b.mesh.position.x += 0.035;
      if (b.mesh.position.x > 16) b.mesh.position.x = -16;
      const flap = Math.sin(t * 7 + b.phase) * 0.42;
      b.wL.rotation.z = flap;
      b.wR.rotation.z = -flap;
    });

    skyDragonflies.forEach(d => {
      d.mesh.position.x = d.base.x + Math.sin(t * 1.6 + d.phase) * 1.4;
      d.mesh.position.y = d.base.y + Math.cos(t * 2.5 + d.phase) * 0.25;
      const flap = Math.sin(t * 34 + d.phase) * 0.35;
      d.w1.rotation.x = flap;
      d.w2.rotation.x = -flap;
    });

    skyBees.forEach(b => {
      b.mesh.position.x = b.base.x + Math.cos(t * 2.4 + b.phase) * 0.9;
      b.mesh.position.y = b.base.y + Math.sin(t * 3.2 + b.phase) * 0.2;
      const flap = Math.sin(t * 42 + b.phase) * 0.45;
      b.bw1.rotation.x = flap;
      b.bw2.rotation.x = -flap;
    });
  });
}

// ----------------------------------------------------------------------------
// LEVEL +1: CITY SKYLINE (도시 상공 - 다리 위 통행 차량 + 도심 속 작은 공원)
// ----------------------------------------------------------------------------
function buildLevel1_City(group) {
  // Base terrain + River (Han River style)
  const land = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
  land.rotation.x = -Math.PI / 2;
  group.add(land);

  const river = new THREE.Mesh(new THREE.PlaneGeometry(90, 10), new THREE.MeshPhongMaterial({ color: 0x0284c7, shininess: 80 }));
  river.rotation.x = -Math.PI / 2;
  river.rotation.z = 0.25;
  river.position.set(0, 0.05, 2);
  group.add(river);

  // Bridges over river
  const bridgeXs = [-12, 4, 18];
  const bridgeMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
  bridgeXs.forEach(bx => {
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.3, 11.5), bridgeMat);
    bridge.position.set(bx, 0.3, 2 - bx * 0.25);
    group.add(bridge);
  });

  // Small City Park (도심 속 작은 공원 - 다음 단계의 잔디밭·사람과 어울리는 녹지 공간)
  const parkGroup = new THREE.Group();
  const parkLawn = new THREE.Mesh(
    new THREE.BoxGeometry(7.2, 0.14, 6.4),
    new THREE.MeshLambertMaterial({ color: 0x22c55e })
  );
  parkLawn.position.set(0, 0.07, 0);
  parkGroup.add(parkLawn);

  const parkWalkway = new THREE.Mesh(
    new THREE.BoxGeometry(0.75, 0.16, 6.2),
    new THREE.MeshLambertMaterial({ color: 0xe2e8f0 })
  );
  parkWalkway.position.set(0, 0.08, 0);
  parkGroup.add(parkWalkway);

  const parkTreeMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
  const parkTreeOffsets = [
    [-2.4, -2.0], [-1.8, 1.8], [-2.7, 0.2],
    [1.9, -1.7], [2.5, 1.5], [1.6, 2.2]
  ];
  parkTreeOffsets.forEach(([tx, tz]) => {
    const tree = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 10), parkTreeMat);
    tree.position.set(tx, 0.52, tz);
    parkGroup.add(tree);
  });
  parkGroup.position.set(-2.5, 0, 10.5);
  group.add(parkGroup);

  // Procedural 3D City Buildings
  const bldgColors = [0x334155, 0x475569, 0x1e3a8a, 0x0f172a, 0x64748b];
  for (let i = 0; i < 160; i++) {
    const x = (Math.random() - 0.5) * 56;
    const z = (Math.random() - 0.5) * 56;
    // Skip river zone
    if (Math.abs(z - (2 - x * 0.25)) < 6.4) continue;
    // Skip small city park zone
    if (Math.abs(x - (-2.5)) < 4.8 && Math.abs(z - 10.5) < 4.4) continue;
    // Skip bridge approach road axes
    if (bridgeXs.some(bx => Math.abs(x - bx) < 1.3)) continue;

    const distFromCenter = Math.hypot(x, z);
    const maxH = Math.max(1.5, 11 - distFromCenter * 0.28);
    const h = 1.2 + Math.random() * maxH;
    const w = 1.1 + Math.random() * 1.6;
    const d = 1.1 + Math.random() * 1.6;

    const mat = new THREE.MeshPhongMaterial({
      color: bldgColors[i % bldgColors.length],
      emissive: i % 4 === 0 ? 0x38bdf8 : 0xfef08a,
      emissiveIntensity: 0.15 + Math.random() * 0.25
    });
    const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    bldg.position.set(x, h / 2, z);
    group.add(bldg);
  }

  // Moving traffic lights: strictly along riverbank roads OR across the 3 bridges
  const cars = [];
  // 1) Cars crossing over the 3 Han River bridges (along Z axis at bridgeXs)
  bridgeXs.forEach(bx => {
    for (let k = 0; k < 6; k++) {
      const dir = k % 2 === 0 ? 1 : -1;
      const car = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 6, 6),
        new THREE.MeshBasicMaterial({ color: dir > 0 ? 0xffffff : 0xf43f5e })
      );
      car.position.set(bx + (dir > 0 ? -0.25 : 0.25), 0.5, (Math.random() - 0.5) * 48);
      group.add(car);
      cars.push({ mesh: car, type: 'bridge', dir, speed: 0.12 + Math.random() * 0.08 });
    }
  });

  // 2) Cars driving parallel to the river on north & south riverside roads (never crossing water)
  for (let i = 0; i < 18; i++) {
    const isNorth = i % 2 === 0;
    const dir = isNorth ? 1 : -1;
    const roadOffset = isNorth ? -6.2 : 6.2;
    const car = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 6, 6),
      new THREE.MeshBasicMaterial({ color: isNorth ? 0xffffff : 0xf43f5e })
    );
    const startX = (Math.random() - 0.5) * 52;
    car.position.set(startX, 0.25, 2 - startX * 0.25 + roadOffset);
    group.add(car);
    cars.push({ mesh: car, type: 'riverside', roadOffset, dir, speed: 0.13 + Math.random() * 0.09 });
  }

  animatables.push(() => {
    if (!group.visible) return;
    cars.forEach(c => {
      if (c.type === 'bridge') {
        c.mesh.position.z += c.dir * c.speed;
        if (c.mesh.position.z > 26) c.mesh.position.z = -26;
        if (c.mesh.position.z < -26) c.mesh.position.z = 26;
      } else {
        c.mesh.position.x += c.dir * c.speed;
        if (c.mesh.position.x > 26) c.mesh.position.x = -26;
        if (c.mesh.position.x < -26) c.mesh.position.x = 26;
        c.mesh.position.z = 2 - c.mesh.position.x * 0.25 + c.roadOffset;
      }
    });
  });
}

    { name: 'Mercury', r: 0.32, dist: 4.2, speed: 1.6, color: 0x94a3b8 },
    { name: 'Venus', r: 0.52, dist: 5.8, speed: 1.2, color: 0xfcd34d },

    { name: 'Jupiter', r: 1.25, dist: 13.0, speed: 0.45, color: 0xfdba74 },
    { name: 'Saturn', r: 1.05, dist: 16.5, speed: 0.32, color: 0xfde68a, hasRing: true },
    { name: 'Uranus', r: 0.72, dist: 19.8, speed: 0.22, color: 0x67e8f9 },
    { name: 'Neptune', r: 0.70, dist: 22.8, speed: 0.16, color: 0x3b82f6 }

      color: p.isEarth ? 0x38bdf8 : 0xffffff,
      transparent: true,

    group.add(pivot);
    planetPivots.push({ pivot, speed: p.speed });

  animatables.push((t) => {

    planetPivots.forEach(p => {
      p.pivot.rotation.y += p.speed * 0.008;

  });
}

// ----------------------------------------------------------------------------
// LEVEL +6: MILKY WAY GALAXY (우리 은하계)
// ----------------------------------------------------------------------------
function buildLevel6_MilkyWay(group) {
  const count = 24000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  const colorInside = new THREE.Color(0xfffbeb);
  const colorMid = new THREE.Color(0x60a5fa);
  const colorOutside = new THREE.Color(0xc084fc);

  const branches = 4;
  const radius = 24;

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;
    const r = Math.pow(Math.random(), 1.6) * radius;
    const spinAngle = r * 0.35;
    const branchAngle = ((i % branches) / branches) * Math.PI * 2;

    const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 1.6;
    const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (1.8 * (1 - r / radius) + 0.25);
    const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 1.6;

    positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
    positions[i3 + 1] = randomY;
    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

    const mixedColor = colorInside.clone();
    if (r < radius * 0.45) {
      mixedColor.lerp(colorMid, r / (radius * 0.45));
    } else {
      mixedColor.copy(colorMid).lerp(colorOutside, (r - radius * 0.45) / (radius * 0.55));
    }
    colors[i3] = mixedColor.r;
    colors[i3 + 1] = mixedColor.g;
    colors[i3 + 2] = mixedColor.b;
  }

  const galaxyGeo = new THREE.BufferGeometry();
  galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const galaxyMat = new THREE.PointsMaterial({
    size: 0.22,
    sizeAttenuation: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true
  });

  const galaxyPoints = new THREE.Points(galaxyGeo, galaxyMat);
  group.add(galaxyPoints);

  // Galactic Core Bright Glow
  const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createCircleGlowTexture('rgba(255,255,255,1)', 'rgba(251,191,36,0.35)', 256),
    transparent: true,
    blending: THREE.AdditiveBlending
  }));
  coreGlow.scale.set(14, 14, 1);
  group.add(coreGlow);

  // "You Are Here" Solar System Marker on Orion Arm
  const sunMarker = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xfde047 })
  );
  sunMarker.position.set(11.5, 0.4, 4.5);
  galaxyPoints.add(sunMarker);

  animatables.push((t) => {
    if (!group.visible) return;
    galaxyPoints.rotation.y = t * 0.08;
  });
}

// ----------------------------------------------------------------------------
// LEVEL +7: UNIVERSE / LOCAL GROUP OF GALAXIES (은하군과 우주)
// ----------------------------------------------------------------------------
function buildLevel7_Universe(group) {
  // Deep Cosmic Web Starfield
  const bgGeo = new THREE.BufferGeometry();
  const bgPos = new Float32Array(5000 * 3);
  const bgCol = new Float32Array(5000 * 3);
  const palette = [new THREE.Color(0x93c5fd), new THREE.Color(0xf9a8d4), new THREE.Color(0xfde68a), new THREE.Color(0xffffff)];

  for (let i = 0; i < 5000; i++) {
    bgPos[i * 3] = (Math.random() - 0.5) * 160;
    bgPos[i * 3 + 1] = (Math.random() - 0.5) * 120;
    bgPos[i * 3 + 2] = (Math.random() - 0.5) * 160;
    const c = palette[i % palette.length];
    bgCol[i * 3] = c.r; bgCol[i * 3 + 1] = c.g; bgCol[i * 3 + 2] = c.b;
  }
  bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
  bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCol, 3));
  group.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ size: 0.35, vertexColors: true, transparent: true, opacity: 0.85 })));

  // Multiple Miniature Spiral & Elliptical Galaxies
  const miniGalaxies = [];
  const galConfigs = [
    { pos: [0, 0, 0], scale: 1.35, color: 0x60a5fa, rot: [0.4, 0, 0.2] },        // Milky Way
    { pos: [-16, 7, -12], scale: 1.5, color: 0xc084fc, rot: [-0.5, 0.3, 0.4] },  // Andromeda
    { pos: [15, -6, -8], scale: 0.95, color: 0xf472b6, rot: [0.8, -0.2, 0.1] },   // Triangulum
    { pos: [-12, -10, 10], scale: 0.8, color: 0x38bdf8, rot: [0.2, 0.5, -0.3] },
    { pos: [18, 11, -18], scale: 1.1, color: 0xfbbf24, rot: [-0.3, -0.4, 0.2] },
    { pos: [4, 14, -24], scale: 0.9, color: 0xa78bfa, rot: [0.6, 0.1, 0.5] },
    { pos: [-22, 1, -22], scale: 1.0, color: 0x34d399, rot: [-0.2, 0.6, -0.4] },
    { pos: [12, -13, 12], scale: 0.75, color: 0xf87171, rot: [0.5, -0.5, 0.2] }
  ];

  galConfigs.forEach(cfg => {
    const gContainer = new THREE.Group();
    const pCount = 1800;
    const pGeo = new THREE.BufferGeometry();
    const pArr = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      const r = Math.pow(Math.random(), 1.5) * 4.5 * cfg.scale;
      const angle = r * 0.9 + (i % 3) * ((Math.PI * 2) / 3);
      pArr[i * 3] = Math.cos(angle) * r + (Math.random() - 0.5) * 0.5;
      pArr[i * 3 + 1] = (Math.random() - 0.5) * 0.35;
      pArr[i * 3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * 0.5;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
    const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
      color: cfg.color,
      size: 0.22,
      blending: THREE.AdditiveBlending,
      transparent: true
    }));

    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: createCircleGlowTexture('rgba(255,255,255,0.95)', 'rgba(147,197,253,0.2)'),
      transparent: true,
      blending: THREE.AdditiveBlending
    }));
    core.scale.set(4 * cfg.scale, 4 * cfg.scale, 1);

    gContainer.add(pts, core);
    gContainer.position.set(...cfg.pos);
    gContainer.rotation.set(...cfg.rot);
    group.add(gContainer);
    miniGalaxies.push(pts);
  });

  // Cosmic Filament Lines connecting galaxies
  const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.16 });
  for (let i = 0; i < galConfigs.length - 1; i++) {
    const points = [
      new THREE.Vector3(...galConfigs[i].pos),
      new THREE.Vector3(...galConfigs[i + 1].pos)
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    group.add(new THREE.Line(lineGeo, lineMat));
  }

  animatables.push((t) => {
    if (!group.visible) return;
    miniGalaxies.forEach((g, i) => {
      g.rotation.y = t * (0.15 + (i % 3) * 0.05);
    });
  });
}

// ----------------------------------------------------------------------------
// LEVEL -1: GRASS & INSECTS (잔디와 곤충들: 꽃 위에 앉아 몸통 기준으로 날개를 움직이는 나비, 무당벌레, 반딧불이)
// ----------------------------------------------------------------------------
function buildLevelM1_GrassInsects(group) {
  // Rich Soil Floor
  const soilFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshLambertMaterial({ color: 0x3e2723 })
  );
  soilFloor.rotation.x = -Math.PI / 2;
  group.add(soilFloor);

  // Giant Macro Grass Blades
  const grassGreens = [0x22c55e, 0x16a34a, 0x4ade80, 0x15803d];
  for (let i = 0; i < 240; i++) {
    const h = 1.8 + Math.random() * 2.8;
    const blade = new THREE.Mesh(
      new THREE.ConeGeometry(0.14, h, 5),
      new THREE.MeshLambertMaterial({ color: grassGreens[i % grassGreens.length] })
    );
    blade.position.set((Math.random() - 0.5) * 18, h / 2, (Math.random() - 0.5) * 14);
    blade.rotation.z = (Math.random() - 0.5) * 0.35;
    blade.rotation.x = (Math.random() - 0.5) * 0.25;
    group.add(blade);
  }

  // Wildflowers (0번 꽃은 나비가 앉을 지정 꽃으로 배치)
  const flowerColors = [0xfde047, 0xf472b6, 0xffffff, 0xc084fc];
  const perchFlowerPos = { x: -1.35, y: 2.15, z: 2.35 };

  for (let i = 0; i < 14; i++) {
    const fGroup = new THREE.Group();
    const stemH = i === 0 ? perchFlowerPos.y : 2.2;
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.05, stemH, 6),
      new THREE.MeshLambertMaterial({ color: 0x15803d })
    );
    stem.position.y = stemH / 2;

    const head = new THREE.Mesh(
      new THREE.DodecahedronGeometry(i === 0 ? 0.38 : 0.32),
      new THREE.MeshLambertMaterial({ color: flowerColors[i % flowerColors.length] })
    );
    head.scale.set(1.25, 0.55, 1.25);
    head.position.y = stemH;
    fGroup.add(stem, head);

    if (i === 0) {
      fGroup.position.set(perchFlowerPos.x, 0, perchFlowerPos.z);
    } else {
      fGroup.position.set((Math.random() - 0.5) * 12, 0, (Math.random() - 0.5) * 8);
    }
    group.add(fGroup);
  }

  // 1) BUTTERFLY (꽃송이 위에 앉아 몸통 관절을 축으로 접힌 날개를 천천히 움직이는 나비)
  const butterfly = new THREE.Group();
  const bfBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.025, 0.45, 8),
    new THREE.MeshBasicMaterial({ color: 0x1e1b4b })
  );
  bfBody.rotation.x = Math.PI / 2;

  const wingMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });

  // 왼쪽 날개 관절(Pivot): 몸통(x=0)에 위치
  const leftWingPivot = new THREE.Group();
  const leftWing = new THREE.Mesh(new THREE.CircleGeometry(0.38, 14), wingMat);
  // 날개 뿌리가 몸통(0,0,0)에 닿도록 위쪽(+Y)으로 반지름만큼 오프셋
  leftWing.position.set(0, 0.35, -0.02);
  leftWing.rotation.y = Math.PI / 2;
  leftWingPivot.add(leftWing);
  leftWingPivot.rotation.z = 0.14; // 위로 접힌 기본 각도

  // 오른쪽 날개 관절(Pivot): 몸통(x=0)에 위치
  const rightWingPivot = new THREE.Group();
  const rightWing = new THREE.Mesh(new THREE.CircleGeometry(0.38, 14), wingMat);
  rightWing.position.set(0, 0.35, -0.02);
  rightWing.rotation.y = Math.PI / 2;
  rightWingPivot.add(rightWing);
  rightWingPivot.rotation.z = -0.14; // 위로 접힌 기본 각도

  butterfly.add(bfBody, leftWingPivot, rightWingPivot);
  butterfly.position.set(perchFlowerPos.x, perchFlowerPos.y + 0.16, perchFlowerPos.z);
  butterfly.rotation.y = 0.55;
  group.add(butterfly);

  // 2) LADYBUG (무당벌레 - red shell with black dots)
  const ladybug = new THREE.Group();
  const lbShell = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshPhongMaterial({ color: 0xef4444 })
  );
  const lbHead = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), new THREE.MeshBasicMaterial({ color: 0x09090b }));
  lbHead.position.set(0, 0.1, 0.32);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0x09090b });
  [[-0.14, 0.28, 0.1], [0.14, 0.28, 0.1], [-0.16, 0.26, -0.12], [0.16, 0.26, -0.12]].forEach(dp => {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), dotMat);
    dot.position.set(...dp);
    ladybug.add(dot);
  });
  ladybug.add(lbShell, lbHead);
  ladybug.position.set(-0.6, 0.4, 3.6);
  group.add(ladybug);

  // 3) FIREFLIES (반딧불이 - glowing bioluminescent abdomen)
  const fireflies = [];
  for (let i = 0; i < 16; i++) {
    const ff = new THREE.Group();
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xd9f99d })
    );
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: createCircleGlowTexture('rgba(217,249,157,1)', 'rgba(163,230,53,0.25)'),
      transparent: true,
      blending: THREE.AdditiveBlending
    }));
    glow.scale.set(0.9, 0.9, 1);
    ff.add(bulb, glow);
    ff.position.set((Math.random() - 0.5) * 11, 0.8 + Math.random() * 2.6, (Math.random() - 0.3) * 8);
    group.add(ff);
    fireflies.push({ mesh: ff, phase: Math.random() * Math.PI * 2, basePos: ff.position.clone() });
  }

  animatables.push((t) => {
    if (!group.visible) return;

    // 꽃 위에 앉은 나비가 몸통(Pivot)을 기준으로 접힌 날개를 천천히 열었다 접음
    const wingAngle = 0.12 + (Math.sin(t * 2.2) + 1) * 0.22; // 0.12 ~ 0.56 라디안 사이로 부드럽게 개폐
    leftWingPivot.rotation.z = wingAngle;
    rightWingPivot.rotation.z = -wingAngle;

    // Ladybug crawl
    ladybug.position.x = -0.6 + Math.sin(t * 0.6) * 1.2;
    ladybug.rotation.y = Math.cos(t * 0.6) > 0 ? Math.PI / 2 : -Math.PI / 2;

    // Fireflies pulse
    fireflies.forEach(f => {
      f.mesh.position.y = f.basePos.y + Math.sin(t * 1.8 + f.phase) * 0.35;
      f.mesh.position.x = f.basePos.x + Math.cos(t * 1.2 + f.phase) * 0.45;
      const pulse = 0.65 + Math.sin(t * 4 + f.phase) * 0.35;
      f.mesh.children[1].scale.setScalar(0.95 * pulse);
    });
  });
}

// ----------------------------------------------------------------------------
// LEVEL -2: TOPSOIL, TREE ROOTS & SUBTERRANEAN BUGS (나무뿌리, 흙, 자갈, 개미, 애벌레, 지렁이)
// ----------------------------------------------------------------------------
function buildLevelM2_RootsSoil(group) {
  // Underground Soil Backdrop
  const backWall = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 26),
    new THREE.MeshLambertMaterial({ color: 0x2b1910 })
  );
  backWall.position.z = -3;
  group.add(backWall);

  // Branching 3D Tree Roots descending from top
  const rootMat = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
  for (let i = 0; i < 18; i++) {
    const curvePts = [
      new THREE.Vector3((Math.random() - 0.5) * 12, 6.5, (Math.random() - 0.5) * 2),
      new THREE.Vector3((Math.random() - 0.5) * 11, 2.5, (Math.random() - 0.5) * 2),
      new THREE.Vector3((Math.random() - 0.5) * 13, -1.5, (Math.random() - 0.5) * 2),
      new THREE.Vector3((Math.random() - 0.5) * 14, -5.2, (Math.random() - 0.5) * 2)
    ];
    const curve = new THREE.CatmullRomCurve3(curvePts);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.12 + Math.random() * 0.18, 7, false), rootMat);
    group.add(tube);
  }

  // Pebbles & Stones embedded in soil
  const stoneMat = new THREE.MeshLambertMaterial({ color: 0x78716c });
  for (let i = 0; i < 45; i++) {
    const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25 + Math.random() * 0.45, 0), stoneMat);
    stone.position.set((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 2.5);
    stone.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    group.add(stone);
  }

  // Ants (개미들) crawling along soil tunnels
  const ants = [];
  const antMat = new THREE.MeshBasicMaterial({ color: 0x09090b });
  for (let i = 0; i < 14; i++) {
    const ant = new THREE.Group();
    const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), antMat);
    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), antMat);
    s2.position.x = 0.12;
    const s3 = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), antMat);
    s3.position.x = -0.15;
    ant.add(s1, s2, s3);
    const yLevel = -2.5 + (i % 4) * 1.6;
    ant.position.set((Math.random() - 0.5) * 12, yLevel, 1.2);
    group.add(ant);
    ants.push({ mesh: ant, dir: i % 2 === 0 ? 1 : -1, speed: 0.025 + Math.random() * 0.02 });
  }

  // Grubs / Larvae (애벌레)
  const grubMat = new THREE.MeshPhongMaterial({ color: 0xfef9c3 });
  const grubs = [];
  for (let i = 0; i < 4; i++) {
    const grub = new THREE.Group();
    for (let seg = 0; seg < 5; seg++) {
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16 - seg * 0.012, 10, 10), grubMat);
      ball.position.set(seg * 0.16, Math.sin(seg * 0.8) * 0.08, 0);
      grub.add(ball);
    }
    grub.position.set(-4 + i * 2.8, -1.5 + (i % 2) * 2.4, 1.4);
    group.add(grub);
    grubs.push(grub);
  }

  // Earthworms (지렁이)
  const wormMat = new THREE.MeshPhongMaterial({ color: 0xf472b6 });
  const worms = [];
  for (let i = 0; i < 3; i++) {
    const wPts = [];
    for (let k = 0; k < 6; k++) wPts.push(new THREE.Vector3(k * 0.35, Math.sin(k) * 0.25, 0));
    const worm = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(wPts), 16, 0.07, 8, false), wormMat);
    worm.position.set(-3 + i * 3.2, -3.2 + i * 1.8, 1.3);
    group.add(worm);
    worms.push(worm);
  }

  animatables.push((t) => {
    if (!group.visible) return;
    ants.forEach(a => {
      a.mesh.position.x += a.dir * a.speed;
      a.mesh.rotation.y = a.dir > 0 ? 0 : Math.PI;
      if (a.mesh.position.x > 7.5) a.dir = -1;
      if (a.mesh.position.x < -7.5) a.dir = 1;
    });
    grubs.forEach((g, idx) => {
      g.scale.x = 1 + Math.sin(t * 3 + idx) * 0.12;
    });
    worms.forEach((w, idx) => {
      w.position.x += Math.sin(t * 1.5 + idx) * 0.005;
    });
  });
}

// ----------------------------------------------------------------------------
// LEVEL -3: UNDERGROUND INFRASTRUCTURE (하수도, 양방향 지하철, 지하수)
// ----------------------------------------------------------------------------
function buildLevelM3_SubwaySewage(group) {
  // Earth / Concrete Cross-Section Backdrop
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(42, 26), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
  wall.position.z = -3.5;
  group.add(wall);

  // Upper: Concrete Sewage & Water Pipes (하수도 및 상수도)
  const pipeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 });
  const mainPipe = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 24, 24, 1, true), pipeMat);
  mainPipe.rotation.z = Math.PI / 2;
  mainPipe.position.set(0, 2.7, 0);
  group.add(mainPipe);

  // Flowing blue water inside pipe
  const waterStream = new THREE.Mesh(
    new THREE.BoxGeometry(24, 0.65, 1.6),
    new THREE.MeshPhongMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.85 })
  );
  waterStream.position.set(0, 2.2, 0.1);
  group.add(waterStream);

  // Middle: Subway Tunnel & Dual-Direction Moving Trains (좌->우, 우->좌 양방향 지하철)
  const tunnelArch = new THREE.Mesh(
    new THREE.CylinderGeometry(2.4, 2.4, 26, 24, 1, true, 0, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x334155, side: THREE.DoubleSide })
  );
  tunnelArch.rotation.z = Math.PI / 2;
  tunnelArch.rotation.x = Math.PI / 2;
  tunnelArch.position.set(0, -1.6, -0.5);
  group.add(tunnelArch);

  const trackBed = new THREE.Mesh(new THREE.BoxGeometry(26, 0.3, 4.8), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
  trackBed.position.set(0, -1.75, 0);
  group.add(trackBed);

  function createSubwayTrain(stripeColor, dir) {
    const tGroup = new THREE.Group();
    const tBody = new THREE.Mesh(
      new THREE.BoxGeometry(7.2, 1.35, 1.35),
      new THREE.MeshPhongMaterial({ color: 0xe2e8f0 })
    );
    const tStripe = new THREE.Mesh(
      new THREE.BoxGeometry(7.25, 0.24, 1.39),
      new THREE.MeshBasicMaterial({ color: stripeColor })
    );
    tGroup.add(tBody, tStripe);

    const winMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
    for (let w = -2.6; w <= 2.6; w += 1.05) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.42, 1.4), winMat);
      win.position.set(w, 0.2, 0);
      tGroup.add(win);
    }

    const headlight = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    headlight.position.set(dir > 0 ? 3.62 : -3.62, -0.22, 0.35);
    tGroup.add(headlight);
    return tGroup;
  }

  // Train 1: Left -> Right (앞쪽 선로)
  const trainLR = createSubwayTrain(0x2563eb, 1);
  trainLR.position.set(-5, -0.9, 0.85);
  group.add(trainLR);

  // Train 2: Right -> Left (뒤쪽 복선 선로)
  const trainRL = createSubwayTrain(0x10b981, -1);
  trainRL.position.set(6, -0.9, -0.85);
  group.add(trainRL);

  // Lower: Natural Groundwater Aquifer (지하수맥)
  const aquifer = new THREE.Mesh(
    new THREE.BoxGeometry(26, 1.3, 3.5),
    new THREE.MeshPhongMaterial({ color: 0x0284c7, transparent: true, opacity: 0.75 })
  );
  aquifer.position.set(0, -3.6, 0);
  group.add(aquifer);

  animatables.push((t) => {
    if (!group.visible) return;
    // Left to Right
    trainLR.position.x += 0.085;
    if (trainLR.position.x > 13.5) trainLR.position.x = -13.5;

    // Right to Left
    trainRL.position.x -= 0.085;
    if (trainRL.position.x < -13.5) trainRL.position.x = 13.5;

    aquifer.material.opacity = 0.65 + Math.sin(t * 2.5) * 0.12;
  });
}

// ----------------------------------------------------------------------------
// LEVEL -4: SEDIMENTARY STRATA, FOSSILS, COAL & OIL (퇴적층, 화석, 석탄, 석유)
// ----------------------------------------------------------------------------
function buildLevelM4_StrataFossils(group) {
  const layerColors = [0x92400e, 0xb45309, 0x78350f, 0x1c1917, 0xa16207, 0x451a03];
  for (let i = 0; i < 6; i++) {
    const isCoal = (i === 3); // Dark shimmering coal seam
    const layer = new THREE.Mesh(
      new THREE.BoxGeometry(32, 1.75, 4),
      new THREE.MeshStandardMaterial({
        color: layerColors[i],
        roughness: isCoal ? 0.25 : 0.85,
        metalness: isCoal ? 0.55 : 0.05
      })
    );
    layer.position.set(0, 4.3 - i * 1.75, -1);
    group.add(layer);
  }

  // Ammonite Spiral Fossils (암모나이트 화석)
  const fossilMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.4 });
  [[-3.6, 2.5], [3.8, 0.8]].forEach(([fx, fy]) => {
    const ammonite = new THREE.Mesh(new THREE.TorusKnotGeometry(0.55, 0.16, 48, 8, 2, 3), fossilMat);
    ammonite.position.set(fx, fy, 1.15);
    group.add(ammonite);
  });

  // Dinosaur Bone / Rib Fossil (공룡 뼈 화석)
  const dinoGroup = new THREE.Group();
  const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.8, 8), fossilMat);
  spine.rotation.z = Math.PI / 2;
  dinoGroup.add(spine);
  for (let r = -1.1; r <= 1.1; r += 0.44) {
    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.06, 6, 12, Math.PI), fossilMat);
    rib.position.set(r, -0.35, 0);
    dinoGroup.add(rib);
  }
  dinoGroup.position.set(0.2, 2.5, 1.15);
  group.add(dinoGroup);

  // Underground Crude Oil & Gas Reservoir Pocket (석유 저류층)
  const oilPocket = new THREE.Mesh(
    new THREE.SphereGeometry(1.6, 24, 16),
    new THREE.MeshPhongMaterial({ color: 0x09090b, shininess: 100, specular: 0x38bdf8 })
  );
  oilPocket.scale.set(2.4, 0.75, 0.8);
  oilPocket.position.set(-1.5, -2.7, 1.1);
  group.add(oilPocket);

  // Natural Gas bubbles above oil
  const gasPocket = new THREE.Mesh(
    new THREE.SphereGeometry(1.1, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.45 })
  );
  gasPocket.scale.set(2.2, 0.5, 0.7);
  gasPocket.position.set(-1.5, -2.0, 1.12);
  group.add(gasPocket);

  animatables.push((t) => {
    if (!group.visible) return;
    gasPocket.material.opacity = 0.35 + Math.sin(t * 3) * 0.15;
  });
}

// ----------------------------------------------------------------------------
// LEVEL -5: BEDROCK & DEEPEST HUMAN BOREHOLE DRILL (기반암과 인류 시추기 끝부분)
// ----------------------------------------------------------------------------
function buildLevelM5_BedrockDrill(group) {
  // Dense Crystalline Granite & Basalt Bedrock Walls
  const graniteMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.85, flatShading: true });
  const basaltMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9, flatShading: true });

  const leftRock = new THREE.Mesh(new THREE.BoxGeometry(14, 16, 6), graniteMat);
  leftRock.position.set(-7.65, 0, 0);
  const rightRock = new THREE.Mesh(new THREE.BoxGeometry(14, 16, 6), basaltMat);
  rightRock.position.set(7.65, 0, 0);
  const bottomRock = new THREE.Mesh(new THREE.BoxGeometry(30, 8, 6), basaltMat);
  bottomRock.position.set(0, -6.2, 0);
  const backRock = new THREE.Mesh(new THREE.PlaneGeometry(32, 24), new THREE.MeshLambertMaterial({ color: 0x111827 }));
  backRock.position.z = -3;
  group.add(leftRock, rightRock, bottomRock, backRock);

  // Kola Superdeep Borehole Drill Shaft & Diamond Drill Bit Tip (~12.2km)
  const drillGroup = new THREE.Group();
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.32, 8.5, 16),
    new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.25 })
  );
  shaft.position.y = 3.2;

  const drillHead = new THREE.Mesh(
    new THREE.ConeGeometry(0.55, 1.5, 12),
    new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.2 })
  );
  drillHead.rotation.x = Math.PI;
  drillHead.position.y = -1.6;

  // Helical drill blades
  const blade = new THREE.Mesh(
    new THREE.TorusKnotGeometry(0.42, 0.08, 32, 6, 1, 3),
    new THREE.MeshBasicMaterial({ color: 0xfef08a })
  );
  blade.position.y = -1.35;

  drillGroup.add(shaft, drillHead, blade);
  drillGroup.position.set(0, 0.5, 0.6);
  group.add(drillGroup);

  // Friction Sparks at the drill tip
  const sparkCount = 40;
  const sparkGeo = new THREE.BufferGeometry();
  const sparkPos = new Float32Array(sparkCount * 3);
  for (let i = 0; i < sparkCount; i++) {
    sparkPos[i * 3] = (Math.random() - 0.5) * 1.8;
    sparkPos[i * 3 + 1] = -1.8 + Math.random() * 1.2;
    sparkPos[i * 3 + 2] = 0.8 + Math.random() * 0.8;
  }
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xfbbf24, size: 0.16 }));
  group.add(sparks);

  animatables.push((t) => {
    if (!group.visible) return;
    drillGroup.rotation.y = t * 8;
    drillGroup.position.y = 0.5 + Math.sin(t * 24) * 0.04;
    sparks.rotation.y = -t * 5;
  });
}

// ----------------------------------------------------------------------------
// LEVEL -6: LOWER CRUST & MAGMA CHAMBER (지각과 마그마)
// ----------------------------------------------------------------------------
function buildLevelM6_CrustMagma(group) {
  // Cracked Dark Volcanic Crust Ceiling
  const crustMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 14; i++) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6 + Math.random() * 1.4, 0), crustMat);
    rock.position.set((i - 6.5) * 2.1, 3.8 + (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 3);
    group.add(rock);
  }

  // Bubbling Incandescent Magma Chamber
  const magmaFloor = new THREE.Mesh(
    new THREE.BoxGeometry(34, 8, 12),
    new THREE.MeshBasicMaterial({ color: 0xea580c })
  );
  magmaFloor.position.set(0, -3.5, 0);
  group.add(magmaFloor);

  // Glowing Lava Blobs / Plumes
  const blobs = [];
  const blobMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
  for (let i = 0; i < 22; i++) {
    const blob = new THREE.Mesh(new THREE.SphereGeometry(0.4 + Math.random() * 0.7, 12, 12), blobMat);
    blob.position.set((Math.random() - 0.5) * 18, -1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 4);
    group.add(blob);
    blobs.push({ mesh: blob, speed: 0.015 + Math.random() * 0.025, phase: Math.random() * 6 });
  }

  // Magma Ambient Point Light
  const magmaLight = new THREE.PointLight(0xff4500, 2.5, 25);
  magmaLight.position.set(0, 0, 3);
  group.add(magmaLight);

  animatables.push((t) => {
    if (!group.visible) return;
    blobs.forEach(b => {
      b.mesh.position.y += b.speed;
      b.mesh.scale.setScalar(0.8 + Math.sin(t * 4 + b.phase) * 0.3);
      if (b.mesh.position.y > 2.8) b.mesh.position.y = -2.2;
    });
  });
}

// ----------------------------------------------------------------------------
// LEVEL -7: THE MANTLE (맨틀 대류층)
// ----------------------------------------------------------------------------
function buildLevelM7_Mantle(group) {
  // Thick Glowing Mantle Shell
  const mantleSphere = new THREE.Mesh(
    new THREE.SphereGeometry(9.5, 36, 36),
    new THREE.MeshBasicMaterial({ color: 0x9a3412, wireframe: true, transparent: true, opacity: 0.25 })
  );
  group.add(mantleSphere);

  // Swirling Convection Current Particles
  const pCount = 2600;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  const pCol = new Float32Array(pCount * 3);
  const c1 = new THREE.Color(0xdc2626);
  const c2 = new THREE.Color(0xf59e0b);

  for (let i = 0; i < pCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 3.5 + Math.random() * 6.5;
    pPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    pPos[i * 3 + 1] = r * Math.cos(phi);
    pPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const mix = c1.clone().lerp(c2, Math.random());
    pCol[i * 3] = mix.r; pCol[i * 3 + 1] = mix.g; pCol[i * 3 + 2] = mix.b;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
  const mantleParticles = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.35,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    transparent: true
  }));
  group.add(mantleParticles);

  // Convection Torus Plume Rings
  const plume1 = new THREE.Mesh(
    new THREE.TorusGeometry(4.2, 0.45, 12, 36),
    new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.55 })
  );
  plume1.position.x = -4.2;
  const plume2 = plume1.clone();
  plume2.position.x = 4.2;
  group.add(plume1, plume2);

  animatables.push((t) => {
    if (!group.visible) return;
    mantleParticles.rotation.y = t * 0.14;
    mantleSphere.rotation.y = -t * 0.08;
    plume1.rotation.z = t * 0.6;
    plume2.rotation.z = -t * 0.6;
  });
}

// ----------------------------------------------------------------------------
// LEVEL -8: OUTER & INNER CORE (외핵과 지구 중심 내핵)
// ----------------------------------------------------------------------------
function buildLevelM8_Core(group) {
  // Blindingly Bright Solid Iron Inner Core (~5,400°C)
  const innerCore = new THREE.Mesh(
    new THREE.SphereGeometry(2.6, 36, 36),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  group.add(innerCore);

  // Intense Solar-White & Golden Radiance Halo
  const coreHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: createCircleGlowTexture('rgba(255,255,255,1)', 'rgba(251,191,36,0.55)', 256),
    transparent: true,
    blending: THREE.AdditiveBlending
  }));
  coreHalo.scale.set(14, 14, 1);
  group.add(coreHalo);

  // Swirling Liquid Iron-Nickel Outer Core Shell
  const outerCore = new THREE.Mesh(
    new THREE.SphereGeometry(5.2, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xf97316, wireframe: true, transparent: true, opacity: 0.38 })
  );
  group.add(outerCore);

  // Magnetic Field Energy Rings generated by the Core
  const magRings = [];
  for (let i = 0; i < 4; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(6.5 + i * 0.6, 0.06, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.45 })
    );
    ring.rotation.set(i * 0.7, i * 0.9, 0);
    group.add(ring);
    magRings.push(ring);
  }

  animatables.push((t) => {
    if (!group.visible) return;
    outerCore.rotation.y = t * 0.35;
    outerCore.rotation.x = t * 0.15;
    coreHalo.scale.setScalar(13.5 + Math.sin(t * 4) * 0.8);
    magRings.forEach((r, idx) => {
      r.rotation.y += 0.01 * (idx + 1);
      r.rotation.x += 0.006 * (idx + 1);
    });
  });
}

// ============================================================================
// NAVIGATION, CAMERA TRANSITIONS & UI UPDATES
// ============================================================================
function setupSidebar() {
  const container = document.getElementById('stage-dots-container');
  container.innerHTML = '';

  STAGES.forEach((stage, idx) => {
    const btn = document.createElement('button');
    btn.className = 'group flex items-center gap-2 focus:outline-none py-0.5';
    btn.onclick = () => goToStage(stage.level);
    btn.title = `${stage.shortName} (${stage.altitude})`;

    const label = document.createElement('span');
    label.id = `side-label-${idx}`;
    label.className = 'hidden lg:inline-block text-[11px] text-slate-400 group-hover:text-white transition-colors text-right min-w-[78px]';
    label.textContent = stage.shortName;

    const dot = document.createElement('span');
    dot.id = `side-dot-${idx}`;
    dot.className = `stage-dot w-2.5 h-2.5 rounded-full bg-slate-500/70 group-hover:bg-sky-300 ${stage.level === 0 ? 'origin-dot' : ''}`;

    btn.appendChild(label);
    btn.appendChild(dot);
    container.appendChild(btn);
  });
}

function goToStage(targetLevel) {
  const targetIdx = STAGES.findIndex(s => s.level === targetLevel);
  if (targetIdx === -1 || targetIdx === currentStageIdx) return;

  const direction = targetLevel - STAGES[currentStageIdx].level;
  playTransitionWhoosh(direction);
  updateAmbientPitch(targetLevel);

  fromStageIdx = currentStageIdx;
  currentStageIdx = targetIdx;
  isTransitioning = true;
  transitionProgress = 0;

  // Reset user drag rotation smoothly
  targetYaw = 0;
  targetPitch = 0;

  // Make both old and new stage groups visible during cinematic zoom crossfade
  STAGES.forEach((s, idx) => {
    stageGroups[s.level].visible = (idx === fromStageIdx || idx === currentStageIdx);
  });

  updateUI();
}

function stepUp() {
  if (currentStageIdx > 0) {
    goToStage(STAGES[currentStageIdx - 1].level);
  } else {
    showToast('가장 높은 우주(은하군) 단계에 도달했습니다!');
  }
}

function stepDown() {
  if (currentStageIdx < STAGES.length - 1) {
    goToStage(STAGES[currentStageIdx + 1].level);
  } else {
    showToast('지구 가장 깊은 중심(내핵)에 도달했습니다!');
  }
}

function updateUI() {
  const stage = STAGES[currentStageIdx];
  document.getElementById('stage-badge').textContent = stage.badge;
  document.getElementById('altitude-text').textContent = stage.altitude;
  document.getElementById('stage-title').textContent = stage.title;
  document.getElementById('stage-desc').textContent = stage.desc;

  // Update Up / Down Button labels & disabled states
  const btnUp = document.getElementById('btn-up');
  const btnDown = document.getElementById('btn-down');
  const nextUpLabel = document.getElementById('next-up-label');
  const nextDownLabel = document.getElementById('next-down-label');

  if (currentStageIdx > 0) {
    btnUp.disabled = false;
    nextUpLabel.textContent = STAGES[currentStageIdx - 1].shortName;
  } else {
    btnUp.disabled = true;
    nextUpLabel.textContent = '최상단 우주 도달';
  }

  if (currentStageIdx < STAGES.length - 1) {
    btnDown.disabled = false;
    nextDownLabel.textContent = STAGES[currentStageIdx + 1].shortName;
  } else {
    btnDown.disabled = true;
    nextDownLabel.textContent = '지구 중심 도달';
  }

  // Update Sidebar Dots
  STAGES.forEach((s, idx) => {
    const dot = document.getElementById(`side-dot-${idx}`);
    const label = document.getElementById(`side-label-${idx}`);
    if (dot) {
      if (idx === currentStageIdx) {
        dot.classList.add('active');
        if (label) label.className = 'hidden lg:inline-block text-[11px] font-bold text-sky-300 transition-colors text-right min-w-[78px]';
      } else {
        dot.classList.remove('active');
        if (label) label.className = `hidden lg:inline-block text-[11px] ${s.level === 0 ? 'text-amber-300 font-semibold' : 'text-slate-400'} group-hover:text-white transition-colors text-right min-w-[78px]`;
      }
    }
  });
}

// ============================================================================
// FULLSCREEN & INPUT CONTROLS
// ============================================================================
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {
      showToast('브라우저 보안 설정으로 전체화면이 제한되었습니다.');
    });
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  }
}

function updateFullscreenButton() {
  const label = document.getElementById('fs-label');
  if (document.fullscreenElement) {
    label.textContent = '전체화면 종료';
  } else {
    label.textContent = '전체화면';
  }
  onWindowResize();
}

function onWindowResize() {
  if (!camera || !renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function setupInputs() {
  // Keyboard Up/Down Arrows & F key for Fullscreen
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      stepUp();
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      e.preventDefault();
      stepDown();
    } else if (e.key === 'Home' || e.key === '0') {
      goToStage(0);
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
    }
  });

  // Mouse Wheel Throttle
  let wheelCooldown = 0;
  window.addEventListener('wheel', (e) => {
    const now = Date.now();
    if (now - wheelCooldown < 420) return;
    if (Math.abs(e.deltaY) > 15) {
      wheelCooldown = now;
      if (e.deltaY < 0) stepUp();
      else stepDown();
    }
  }, { passive: true });

  // Pointer Drag for 3D Camera Angle Exploration
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', (e) => {
    isDragging = true;
    prevPointer = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevPointer.x;
    const dy = e.clientY - prevPointer.y;
    prevPointer = { x: e.clientX, y: e.clientY };

    targetYaw -= dx * 0.005;
    targetPitch = Math.max(-0.55, Math.min(0.55, targetPitch + dy * 0.004));
  });

  window.addEventListener('pointerup', () => {
    isDragging = false;
  });
}

// ============================================================================
// MAIN ANIMATION LOOP (Cinematic Scale Zoom & Render)
// ============================================================================
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  const targetStage = STAGES[currentStageIdx];
  const fromStage = STAGES[fromStageIdx];

  // Smooth Camera Zoom & Scale Morphing Transition
  if (isTransitioning) {
    transitionProgress += delta * 1.35; // ~0.74s cinematic transition
    if (transitionProgress >= 1) {
      transitionProgress = 1;
      isTransitioning = false;
      // Hide previous group cleanly
      STAGES.forEach((s, idx) => {
        stageGroups[s.level].visible = (idx === currentStageIdx);
        stageGroups[s.level].scale.setScalar(1);
        stageGroups[s.level].position.set(0, 0, 0);
      });
    } else {
      const ease = easeInOutCubic(transitionProgress);
      const movingUp = targetStage.level > fromStage.level;

      const fromGroup = stageGroups[fromStage.level];
      const toGroup = stageGroups[targetStage.level];

      if (movingUp) {
        // Zooming out / ascending: old layer shrinks downward, new layer descends into place
        fromGroup.scale.setScalar(THREE.MathUtils.lerp(1, 0.12, ease));
        fromGroup.position.y = THREE.MathUtils.lerp(0, -14, ease);
        toGroup.scale.setScalar(THREE.MathUtils.lerp(4.5, 1, ease));
        toGroup.position.y = THREE.MathUtils.lerp(14, 0, ease);
      } else {
        // Zooming in / descending: old layer expands past camera upward, new layer rises into view
        fromGroup.scale.setScalar(THREE.MathUtils.lerp(1, 5.5, ease));
        fromGroup.position.y = THREE.MathUtils.lerp(0, 14, ease);
        toGroup.scale.setScalar(THREE.MathUtils.lerp(0.15, 1, ease));
        toGroup.position.y = THREE.MathUtils.lerp(-14, 0, ease);
      }

      // Interpolate Background & Fog colors
      const cFromBg = new THREE.Color(fromStage.bgColor);
      const cToBg = new THREE.Color(targetStage.bgColor);
      scene.background.copy(cFromBg).lerp(cToBg, ease);

      const cFromFog = new THREE.Color(fromStage.fogColor);
      const cToFog = new THREE.Color(targetStage.fogColor);
      scene.fog.color.copy(cFromFog).lerp(cToFog, ease);
      scene.fog.density = THREE.MathUtils.lerp(fromStage.fogDensity, targetStage.fogDensity, ease);
    }
  } else {
    scene.background.setHex(targetStage.bgColor);
    scene.fog.color.setHex(targetStage.fogColor);
    scene.fog.density = targetStage.fogDensity;
  }

  // Smoothly interpolate camera position + user drag orbit
  userYaw += (targetYaw - userYaw) * 0.08;
  userPitch += (targetPitch - userPitch) * 0.08;

  const basePos = new THREE.Vector3(...targetStage.camPos);
  const lookAtTarget = new THREE.Vector3(...targetStage.camTarget);

  // Subtle idle breathing camera motion
  const breatheX = Math.sin(elapsed * 0.5) * 0.18;
  const breatheY = Math.cos(elapsed * 0.4) * 0.12;

  const offset = basePos.clone().sub(lookAtTarget);
  offset.applyAxisAngle(new THREE.Vector3(0, 1, 0), userYaw);
  offset.y += userPitch * offset.length() * 0.5;

  const finalCamPos = lookAtTarget.clone().add(offset);
  finalCamPos.x += breatheX;
  finalCamPos.y += breatheY;

  camera.position.lerp(finalCamPos, 0.1);
  camera.lookAt(lookAtTarget);

  // Run per-layer 3D animations
  for (let i = 0; i < animatables.length; i++) {
    animatables[i](elapsed, delta);
  }

  renderer.render(scene, camera);
}

window.onload = function () {
  initThree();
  animate();
};
</script>
