<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#007bff">
    <link rel="manifest" href='data:application/manifest+json,{
      "display":"standalone", "start_url":"index.html",
      "name":"A♥️J 스마트 메모장", "short_name":"A♥️J스마트메모장",
      "icons":[{
        "src":"https://b-o-o-x.github.io/pwa/smart-memo/smart-memo-512.png",
        "sizes":"512x512", "type":"image/png"
      }]
    }'/>
    <title>A♥️J 스마트 메모장</title>
    
    <style>
        :root {
            --bg-color: #f8f9fa;
            --header-bg: #ffffff;
            --text-color: #333;
            --accent-color: #007bff;
            --textarea-bg: #ffffff;
            --border-color: #ddd;
        }

        body.dark {
            --bg-color: #1e1e1e;
            --header-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --textarea-bg: #252525;
            --border-color: #444;
        }

        body.green { --bg-color: #e8f5e9; --header-bg: #c8e6c9; --text-color: #2e7d32; --textarea-bg: #f1f8e9; --border-color: #a5d6a7; }
        body.pink { --bg-color: #fce4ec; --header-bg: #f8bbd0; --text-color: #880e4f; --textarea-bg: #fff1f8; --border-color: #f48fb1; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
        }

        .logo { font-weight: bold; font-size: 1.1rem; letter-spacing: -0.5px; }
        .menu-icons { display: flex; gap: 10px; }
        .icon-btn {
            background: none; border: none; cursor: pointer;
            font-size: 1.3rem; color: var(--text-color);
            padding: 8px; border-radius: 8px;
            transition: background 0.2s;
        }
        .icon-btn:hover { background-color: rgba(0,0,0,0.08); }

        main { flex: 1; padding: 15px; display: flex; justify-content: center; height: calc(100% - 60px); }
        #memoEditor {
            width: 100%; max-width: 900px; height: 100%;
            padding: 20px; font-size: 1.1rem; line-height: 1.6;
            border: 1px solid var(--border-color); border-radius: 12px;
            background-color: var(--textarea-bg); color: var(--text-color);
            resize: none; outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        #infoModal, #modalOverlay { display: none; }
        #modalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        #infoModal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--header-bg); padding: 30px; border-radius: 20px;
            z-index: 100; text-align: center; min-width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body onload="initApp()">

<header>
    <div class="logo">✨ Smart Memo V260217-1547</div>
    <div class="menu-icons">
        <button class="icon-btn" onclick="downloadMemo()" title="파일로 저장">📥</button>
        <button class="icon-btn" onclick="changeTheme()" title="테마 변경">🎨</button>
        <button class="icon-btn" onclick="toggleInfo()" title="정보">ℹ️</button>
    </div>
</header>

<main>
    <textarea id="memoEditor" placeholder="[업데이트 내용]&#10;3*4=12+2=14 (연속 계산 지원)&#10;문자 포함 괄호 무시 및 % 계산 기능 유지"></textarea>
</main>

<div id="modalOverlay" onclick="toggleInfo()"></div>
<div id="infoModal">
    <h2 style="margin-bottom: 10px;">Smart Memo Pro</h2>
    <p>버전: V260217-1547 (PWA 지원)</p>
    <p>개발: 양승민 (Gemini AI)</p>
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">
    <p style="font-size: 0.9rem; opacity: 0.8;">3*4=12+2=14 (연속 계산 지원)</p>
    <button onclick="toggleInfo()" style="margin-top: 20px; padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; background: var(--accent-color); color: white;">확인</button>
</div>

<script>
    const memo = document.getElementById('memoEditor');
    const themes = ['', 'dark', 'green', 'pink'];
    let currentThemeIdx = 0;

    function initApp() {
        const savedData = localStorage.getItem('smartMemoContent');
        if (savedData) memo.value = savedData;
        const savedTheme = localStorage.getItem('smartMemoTheme');
        if (savedTheme) {
            currentThemeIdx = parseInt(savedTheme);
            document.body.className = themes[currentThemeIdx];
        }
        //registerServiceWorker();
    }

    memo.addEventListener('input', (e) => {
        localStorage.setItem('smartMemoContent', memo.value);

        if (e.data === '=') {
            const value = memo.value;
            const pos = memo.selectionStart;
            
            // 현재 줄 가져오기
            const lines = value.substring(0, pos).split('\n');
            let currentLine = lines[lines.length - 1]; // 예: "3*4=12+2="

            // 연속 계산 처리: 마지막 '=' 기호를 제외하고 그 이전의 '='가 있는지 확인
            // 마지막 '=' 바로 앞까지의 텍스트에서 가장 마지막 '='의 위치를 찾음
            const contentBeforeLastEqual = currentLine.slice(0, -1);
            const lastEqualIndex = contentBeforeLastEqual.lastIndexOf('=');
            
            // 계산 대상 구간 추출 (가장 마지막 '=' 이후부터 현재 '=' 직전까지)
            let targetSegment = (lastEqualIndex === -1) 
                ? contentBeforeLastEqual 
                : contentBeforeLastEqual.substring(lastEqualIndex + 1);

            // 1. 콤마 여부 확인 (대상 구간 내에 콤마가 있는지)
            const hasComma = targetSegment.includes(',');

            // 2. 문자가 포함된 괄호 영역 제거
            let processedSegment = targetSegment.replace(/\([^)]*[가-힣a-zA-Z][^)]*\)/g, '');

            // 3. % 연산 처리
            processedSegment = processedSegment.replace(/([0-9.,]+)%/g, '($1/100)');

            // 4. 순수 수식 추출
            let cleanExpr = processedSegment.replace(/[^-0-9+*/().,]/g, '').replace(/,/g, '');

            try {
                if (cleanExpr.trim() !== '') {
                    // eval은 문자열 수식을 계산함
                    let result = eval(cleanExpr);
                    
                    // 소수점 처리 (최대 10자리까지만, 불필요한 0 제거)
                    if (!Number.isInteger(result)) {
                        result = Number(result.toFixed(10));
                    }
                    
                    let formattedResult = hasComma ? result.toLocaleString() : result;
                    
                    const before = value.substring(0, pos);
                    const after = value.substring(pos);
                    memo.value = before + formattedResult + after;
                    
                    const newPos = pos + String(formattedResult).length;
                    memo.setSelectionRange(newPos, newPos);
                    localStorage.setItem('smartMemoContent', memo.value);
                }
            } catch (err) {
                console.log("계산 오류: ", err);
            }
        }
    });

    function downloadMemo() {
        const text = memo.value;
        const now = new Date();
        const f = (n) => String(n).padStart(2, '0');
        const timestamp = `${now.getFullYear()}${f(now.getMonth()+1)}${f(now.getDate())}_${f(now.getHours())}${f(now.getMinutes())}${f(now.getSeconds())}`;
        
        const blob = new Blob([text], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `memo_${timestamp}.txt`;
        a.click();
        window.URL.revokeObjectURL(url);
    }

    function changeTheme() {
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        document.body.className = themes[currentThemeIdx];
        localStorage.setItem('smartMemoTheme', currentThemeIdx);
    }

    function toggleInfo() {
        const isVisible = document.getElementById('infoModal').style.display === 'block';
        document.getElementById('infoModal').style.display = isVisible ? 'none' : 'block';
        document.getElementById('modalOverlay').style.display = isVisible ? 'none' : 'block';
    }

    // Blob으로 가짜 sw.js를 만드는 코드
    function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('install', (e) => self.skipWaiting()); self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => {})));`;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    }

    memo.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = memo.selectionStart;
            memo.value = memo.value.substring(0, start) + "\t" + memo.value.substring(memo.selectionEnd);
            memo.selectionStart = memo.selectionEnd = start + 1;
        }
    });
</script>
    
<script>
// 스크립트 맨 하단에 이것만 사용
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log("서비스 워커 등록 성공!");
        }).catch(err => {
            console.log("등록 실패:", err);
        });
    });
}
</script>
</body>
</html>
